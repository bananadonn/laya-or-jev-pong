repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^server/
      - id: ruff-format
        files: ^server/

  - repo: local
    hooks:
      - id: tsc-noemit
        name: tsc --noEmit
        entry: npx tsc --noEmit
        language: system
        pass_filenames: false
        files: \.tsx?$

      - id: eslint
        name: eslint
        entry: npx eslint . --ext .ts
        language: system
        pass_filenames: false
        files: \.tsx?$

      - id: prettier-check
        name: prettier --check
        entry: npx prettier --check .
        language: system
        pass_filenames: false
